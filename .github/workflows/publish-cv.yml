name: Publish CV PDF

on:
  push:
    paths:
      - ".github/workflows/publish-cv.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact CV pages exported from Figma
        run: |
          curl -fL "https://www.figma.com/api/mcp/asset/ecaef5f4-8f98-4116-aaff-ae64ba0c9114.pdf" -o /tmp/cv-page-1.pdf
          curl -fL "https://www.figma.com/api/mcp/asset/038af722-7d51-4485-a090-2143cbb82d1e.pdf" -o /tmp/cv-page-2.pdf
      - name: Merge pages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfunite /tmp/cv-page-1.pdf /tmp/cv-page-2.pdf assets/Zsanett_Tamas_CV_2026.pdf
      - name: Commit CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Zsanett_Tamas_CV_2026.pdf
          git commit -m "Replace CV with uploaded Figma export" || exit 0
          git push
